name: MultiGPU static compatibility

on:
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'models/**'
      - 'preprocessing/**'
      - 'postprocessing/**'
      - 'scripts/audit_multigpu.py'
      - 'scripts/multigpu_smoke.py'
      - 'wgp.py'
      - 'README.md'
      - 'plugins/about/plugin.py'
      - '.github/workflows/multigpu-audit.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile core MultiGPU and model integrations
        run: |
          python -m py_compile \
            wgp.py \
            shared/multigpu_offload.py \
            shared/kernels/int8_backend.py \
            models/TTS/chatterbox/models/t3/modules/cond_enc.py \
            models/TTS/chatterbox/models/voice_encoder/voice_encoder.py \
            models/TTS/chatterbox/mtl_tts.py \
            models/TTS/chatterbox/pipeline.py \
            plugins/about/plugin.py \
            scripts/multigpu_smoke.py
      - name: Verify README and UI project attribution
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          header = Path("wgp.py").read_text(encoding="utf-8")
          about = Path("plugins/about/plugin.py").read_text(encoding="utf-8")

          assert "🔥 Latest Updates" not in readme
          assert "Wan2GP v13.141 by" in readme
          assert "MultiGPU by" in readme
          assert "github.com/QueenDekim" in readme
          assert "github.com/deepbeepmeep" in readme
          assert "MultiGPU by QueenDekim" in header
          assert "github.com/QueenDekim" in header
          assert "github.com/deepbeepmeep" in header
          assert "GPU-first fork" in about
          assert "QueenDekim" in about
          PY
      - name: Inventory all model families and memory transitions
        run: |
          python scripts/audit_multigpu.py --out multigpu-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multigpu-static-audit
          path: multigpu-audit.json
          if-no-files-found: ignore
